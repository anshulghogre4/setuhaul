[project]
name = "setuhaul-backend"
version = "0.1.0"
description = "SetuHaul FastAPI modular monolith (Sprint 1 walking skeleton)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
  "python-multipart>=0.0.17,<1.0.0",
  # E4.1 (issue #31): langchain-core 1.x is a prerequisite of langchain-google-genai>=4.x, not an
  # independent choice -- 2.1.12 (the version this pin previously allowed) fails the multi-turn
  # tool loop on gemini-3.7-flash with "Function call is missing a thought_signature" (a real,
  # still-open upstream issue class), fixed at >=3.1.0; the design's own pre-commit spike (run
  # 2026-08-21, TECH_STACK.md section 7) validated the loop specifically at 4.3.5.
  "langchain>=0.3.0,<2.0.0",
  "langchain-openai>=0.3.0,<2.0.0",
  "langchain-google-genai>=4.0.0,<5.0.0",
  "langchain-core>=1.0.0,<2.0.0",
  "truststore>=0.10.0,<1.0.0",
  "upstash-redis>=1.2.0,<2.0.0",
  # E4.4 (issue #34): native async Redis protocol, opt-in via UPSTASH_REDIS_NATIVE_URL --
  # upstash-redis (above) stays the REST fallback when that URL isn't configured.
  "redis>=5.0.0,<6.0.0",
  "boto3>=1.35.0,<2.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
agentcore = [
  "aws-opentelemetry-distro>=0.18.0",
  "opentelemetry-instrumentation-langchain>=0.40.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
