[project]
name = "setuhaul-backend"
version = "0.1.0"
description = "SetuHaul FastAPI modular monolith (Sprint 1 walking skeleton)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
  "python-multipart>=0.0.17,<1.0.0",
  # E4.1 (issue #31): langchain-core 1.x is a prerequisite of langchain-google-genai>=4.x, not an
  # independent choice -- 2.1.12 (the version this pin previously allowed) fails the multi-turn
  # tool loop on gemini-3.7-flash with "Function call is missing a thought_signature" (a real,
  # still-open upstream issue class), fixed at >=3.1.0; the design's own pre-commit spike (run
  # 2026-08-21, TECH_STACK.md section 7) validated the loop specifically at 4.3.5.
  "langchain>=0.3.0,<2.0.0",
  "langchain-openai>=0.3.0,<2.0.0",
  "langchain-google-genai>=4.0.0,<5.0.0",
  "langchain-core>=1.0.0,<2.0.0",
  "truststore>=0.10.0,<1.0.0",
  "upstash-redis>=1.2.0,<2.0.0",
  # E4.4 (issue #34): native async Redis protocol, opt-in via UPSTASH_REDIS_NATIVE_URL --
  # upstash-redis (above) stays the REST fallback when that URL isn't configured.
  "redis>=5.0.0,<6.0.0",
  "boto3>=1.35.0,<2.0.0",
  # E7.2 (issue #46), DEPLOYMENT.md section 8 (D-3): Sentry owns unhandled exceptions with stack
  # traces. Main dependencies rather than an extra, because both deployed targets need it -- ECS
  # serves the REST surfaces and AgentCore runs the driver turn, and a crash in either is the thing
  # this exists to catch. `docs/scripts/stage_agentcore_codezip.py` builds the codezip's dependency
  # list from this array, so listing it here is what puts it in the agent artifact too. Inert until
  # SENTRY_DSN is set: `observability.init_sentry` never imports it while the DSN is empty.
  "sentry-sdk>=2.68.0,<3.0.0",
  # E7.3 (issue #51): the *API* package only, never the SDK. It supplies `get_tracer` for the
  # tool-level spans in `observability.py` and is a no-op with no provider installed, so the same
  # code path runs locally, on ECS and on AgentCore instead of only ever executing in production.
  # Pinned at the version `aws-opentelemetry-distro` 0.19.0 itself resolves, so the codezip cannot
  # end up with two different opentelemetry-api versions fighting.
  "opentelemetry-api>=1.44.0,<2.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
agentcore = [
  # 0.18.0 is not an arbitrary floor. It is the release that fixed the `RecursionError` in ADOT's
  # OTLP AWS exporter (`aws_auth_session.py`) which blocked every in-app span from exporting --
  # issue #51's root cause. Upstream release note: "avoid RecursionError when pip_system_certs
  # replaces ssl.SSLContext (truststore injection) by rebinding stale botocore/urllib3 SSL context
  # references and caching credentials in AwsAuthSession". This project triggers exactly that
  # condition: `app/core/tls.py` calls `truststore.inject_into_ssl()`. Do not lower this floor.
  "aws-opentelemetry-distro>=0.18.0",
  "opentelemetry-instrumentation-langchain>=0.40.0",
]

[dependency-groups]
# Test-only. `opentelemetry-sdk` exists here so the E7.3 span tests can install a real
# TracerProvider with an in-memory exporter and assert the spans that reach it -- the no-op
# provider records nothing, so without a real SDK in the test environment those assertions would
# be vacuous. Deliberately NOT a main dependency: `stage_agentcore_codezip.py` reads only
# `[project.dependencies]`, so keeping it here is what stops a second, unconfigured SDK shipping
# into the AgentCore artifact alongside ADOT's own.
dev = [
  "opentelemetry-sdk>=1.44.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
