</div>
</div>
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant block uppercase tracking-wider" for="password">Access Token</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Recover Access</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">key</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all font-body-md text-body-md placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container-low text-primary-container focus:ring-primary-container focus:ring-offset-surface" id="remember" type="checkbox"/>
<label class="ml-2 font-body-md text-body-md text-on-surface-variant" for="remember">Maintain active session</label>
</div>
<button class="w-full bg-primary-container text-white font-title-md text-title-md rounded-lg py-3 px-4 hover:bg-inverse-primary transition-colors flex items-center justify-center gap-2 group" type="button">
                        Initialize Session

</button>
</form>
<div class="mt-12 pt-8 border-t border-outline-variant/30 text-center">
