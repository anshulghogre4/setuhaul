<style>
        body {
            background-color: #FDFBF7;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(45, 30, 30, 0.05);
        }
        .btn-primary {
            background-color: #2a1700;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 0 0 4px rgba(42, 23, 0, 0.2);
            background-color: #402300;
        }
        .input-field {
            border: none;
            border-bottom: 1px solid #d8c3ad;
            background: transparent;
            border-radius: 0;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-bottom-color: #f59e0b;
            box-shadow: 0 1px 0 0 #f59e0b;
        }

<body class="h-screen w-full font-body-md text-on-surface antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<main class="flex h-full w-full">
<!-- Left Side: Image/Map (Hidden on smaller screens) -->
<section class="hidden lg:block relative w-1/2 h-full bg-[#120D0C] overflow-hidden">
<img alt="" class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-luminosity" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtiTFsGWxRCYFYlP-vrDYp-jG38Z5O4wllKlKF9SkV4EgG8ERS1uv-_YgIQ13ge1yS1b6ihxUZOMlf5cgQszYz3W_zddP2Pj7VtwaHCJZif7TcrLdJJhJdGPH5pwYEwODZZshuWomGnB7JvbVcw6DkZrgnGurs_G5Lk-bqDK8-weNLhu_7Tb5f6lJF2XJJ4VawQahTQf0V73Yk_Wt3QItCiN8-P7JFQ5m_fA9bzRz3sciFxB34wgJUmA"/>
<div class="absolute inset-0 bg-gradient-to-t from-[#120D0C] via-transparent to-transparent opacity-80 pointer-events-none"></div>
<div class="absolute inset-0 bg-secondary/10 mix-blend-color pointer-events-none"></div>
<!-- Optional overlay content on image -->
<div class="absolute bottom-12 left-12 max-w-md p-6 bg-surface-container-high/90 backdrop-blur-md rounded-xl border border-outline-variant/30 text-on-surface">
<h2 class="font-headline-lg text-headline-lg mb-2">Global Connectivity</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Real-time supply chain visualization and AI-driven route optimization.</p>
</div>
</section>
<!-- Right Side: Login Form -->
<section class="w-full lg:w-1/2 h-full flex flex-col justify-center items-center p-8 relative bg-surface">
<div class="w-full max-w-md space-y-10">
<!-- Branding -->
<div class="text-center space-y-2">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">SetuHaul AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Elite Logistics Intelligence</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-[16px] p-8 space-y-8">
<form class="space-y-6">
<div class="space-y-4">
<!-- Email Input -->
<div class="relative">
<label class="block font-label-md text-label-md text-tertiary mb-1" for="email">Work Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline px-2" data-icon="mail">mail</span>
<input class="input-field w-full pl-10 py-3 text-on-surface font-body-md placeholder-outline-variant" id="email" name="email" placeholder="commander@setuhaul.ai" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="relative">
<div class="flex justify-between items-center mb-1">
<label class="block font-label-md text-label-md text-tertiary" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline px-2" data-icon="lock">lock</span>
<input class="input-field w-full pl-10 py-3 text-on-surface font-body-md placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- CTA Button -->
<button class="btn-primary w-full py-4 rounded-lg font-headline-md text-[18px] flex justify-center items-center gap-2 mt-4" type="submit">
                            Access Command
                            <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4">
<div class="h-px bg-outline-variant/50 flex-1"></div>
<span class="font-label-md text-label-md text-outline">OR</span>
<div class="h-px bg-outline-variant/50 flex-1"></div>
</div>
<!-- SSO Option -->
<button class="w-full py-3 rounded-lg border border-outline-variant hover:bg-surface-variant/50 transition-colors flex justify-center items-center gap-3 font-label-md text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="business">business</span>
                        Continue with Enterprise SSO
                    </button>
</div>
</div>
<!-- Footer -->
<footer class="absolute bottom-8 text-center w-full flex flex-col items-center justify-center gap-1 opacity-70">
<p class="font-mono-sm text-mono-sm text-on-surface-variant">Powered by Google Gemini | Built with LangGraph</p>
<div class="flex gap-4 font-label-md text-[12px] text-tertiary">
<a class="hover:text-on-surface" href="#">Privacy</a>
<a class="hover:text-on-surface" href="#">Terms</a>
<a class="hover:text-on-surface" href="#">System Status</a>
</div>
</footer>
</section>
</main>
</body></html>
