name: CI

on:
  push:
    branches: [main, master, hosting]
  pull_request:

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.8.4
      - name: Install dependencies
        # pyproject.toml + uv.lock, matching the Dockerfile -- not requirements.txt. That file
        # drifted out of sync with the real dependency set (E4.2/issue #32: it still had the
        # pre-E4.1 langchain-google-genai pin while this workflow used it, so CI had been testing
        # a different dependency set than local dev/Docker without anyone noticing).
        run: uv sync --frozen
      - name: Run unit tests
        # `uv run --no-sync pytest` (bare) does not add cwd to sys.path, so `from app...` imports
        # fail -- `python -m pytest` does. Hit and worked around locally this same session.
        run: uv run --no-sync python -m pytest tests/unit -q

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder
          VITE_API_BASE_URL: http://localhost:8000
